<form>
    <label for="expense-name">Expense Name:</label>
    <input type="text" id="expense-name" name="expense-name">

    <label for="expense-amount">Amount:</label>
    <input type="number" id="expense-amount" name="expense-amount">

    <label for="expense-category">Category:</label>
    <select id="expense-category" name="expense-category">
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Rent">Rent</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
    </select>

    <label for="expense-date">Date:</label>
    <input type="date" id="expense-date" name="expense-date">

    <button type="button">Add Expense</button>
</form>
